const letters=["A","B","C","D"]; let seconds=40*60, interval=null, submitted=false;
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){

 DATA.mc.forEach((q,i)=>{out+=`<article class="question" id="mc${i}"><h3>Câu ${i+1} <span class="level">${q.level}</span>: ${esc(q.question)}</h3><div class="options">`;
 q.options.forEach((o,j)=>out+=`<label class="opt"><input type="radio" name="mc${i}" value="${letters[j]}"><span><b>${letters[j]}.</b> ${esc(o)}</span></label>`);
 out+='</div></article>';});
 out+='<h2 class="section-title">PHẦN 2: TRẮC NGHIỆM ĐÚNG/SAI (5 CÂU)</h2>';
 DATA.tf.forEach((q,i)=>{out+=`<article class="question" id="tf${i}"><h3>Câu ${i+1}: ${esc(q.question)}</h3>`;
 q.items.forEach((item,j)=>out+=`<div class="tfgrid"><div><b>${"abcd"[j]})</b> ${esc(item)}</div><select name="tf${i}_${j}" aria-label="Chọn đúng sai câu ${i+1} ý ${"abcd"[j]}"><option value="">-- Chọn --</option><option value="Đúng">Đúng</option><option value="Sai">Sai</option></select></div>`);
 out+='</article>';});
 out+='<h2 class="section-title">PHẦN 3: CÂU TRẢ LỜI NGẮN (5 CÂU)</h2>';
 DATA.short.forEach((q,i)=>out+=`<article class="question" id="sh${i}"><h3>Câu ${i+1}: ${esc(q.question)}</h3><input class="short-answer" id="short${i}" placeholder="Nhập câu trả lời của em"></article>`);
 $('#exam').innerHTML=out;
}
function normalize(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/đ/g,"d").replace(/\\s+/g,"").replace(/,/g,".");}
function submitExam(auto){
 if(submitted)return;
 const name=$('#student').value.trim(); if(!name&&!auto){$('#student').focus();alert("Em hãy nhập họ và tên trước khi nộp bài.");return;}
 submitted=true;clearInterval(interval);
 let earned=0,total=0,review=[];
 DATA.mc.forEach((q,i)=>{if(q.answer){total++;let chosen=document.querySelector(`input[name="mc${i}"]:checked`)?.value||"";let ok=chosen===q.answer;if(ok)earned++;
 review.push({id:`Câu ${i+1}`,ok,chosen:chosen||"Chưa trả lời",answer:q.answer,explain:q.explain,kind:"mc"});}});
 DATA.tf.forEach((q,i)=>q.items.forEach((_,j)=>{total++;let chosen=document.querySelector(`[name="tf${i}_${j}"]`).value;let answer=q.answers[j],ok=chosen===answer;if(ok)earned++;
 review.push({id:`Đúng/Sai – Câu ${i+1} ý ${"abcd"[j]}`,ok,chosen:chosen||"Chưa trả lời",answer,explain:q.explains[j],kind:"tf"});}));
 DATA.short.forEach((q,i)=>{let chosen=$(`#short${i}`).value.trim();let ok=q.answer.some(a=>normalize(chosen)===normalize(a));total++;if(ok)earned++;

 const score=earned/total*10, pct=Math.round(earned/total*100);

 html+='<div class="feedback neutral"><b>Lưu ý về dữ liệu đáp án gốc:</b> Câu 23 phần 1 có đáp án chi tiết hiệu chỉnh là A (khác bảng đáp án tổng hợp); câu 28 có lời giải chi tiết cho kết quả 8,0 gam nên chấm A; câu 30 phần 1 không có lựa chọn phù hợp với phép tính trong lời giải (kết quả 40 kg), vì vậy câu này được giữ nguyên nhưng không tính điểm. Câu 30 phần 1 không nằm trong mẫu số điểm.</div>';

}
function tick(){seconds--;let m=Math.floor(seconds/60),s=seconds%60;$('#timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=300)$('#timer').classList.add('warning');if(seconds<=0){$('#timer').textContent="00:00";submitExam(true);}}
render();interval=setInterval(tick,1000);
</script></body></html>
